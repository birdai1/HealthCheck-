<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>HealthCheck</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
    .segment-btn { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
    .segment-btn.active { background-color: #000000; color: white; transform: scale(1.02); }

    @keyframes popIn {
      0% { transform: scale(0.9); opacity: 0; }
      70% { transform: scale(1.05); }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop { animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

    .spinner {
      width: 44px; height: 44px; border: 4px solid #f3f3f3; border-top: 4px solid #000;
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    #fx-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
    .score-wrap { display: inline-flex; align-items: flex-start; }
    .score-big { line-height: 0.85; letter-spacing: -0.05em; }
    .score-outof { margin-top: 10px; font-size: 20px; color: #9ca3af; font-weight: 700; margin-left: 4px; }
  </style>
</head>
<body class="bg-white text-black min-h-screen flex flex-col items-center p-6">

  <canvas id="fx-canvas"></canvas>

  <main class="w-full max-w-[400px] flex flex-col flex-grow relative z-10">

    <header id="app-header" class="mt-8 mb-12 text-center">
      <h1 class="text-3xl font-black tracking-tighter">HealthCheck</h1>
      <p class="text-gray-400 font-medium text-sm">Check your day in 5 seconds.</p>
    </header>

    <!-- SCREEN A: INPUT -->
    <div id="view-input" class="space-y-10 flex-grow">
      <div class="space-y-8">
        <div class="space-y-3">
          <label class="text-xs font-bold uppercase tracking-widest text-gray-400 ml-1">Sleep</label>
          <div class="grid grid-cols-3 gap-2 bg-gray-100 p-1.5 rounded-2xl">
            <button onclick="setVal('sleep', 0, this)" class="segment-btn py-3.5 text-sm font-bold rounded-xl text-gray-500">Bad</button>
            <button onclick="setVal('sleep', 1, this)" class="segment-btn py-3.5 text-sm font-bold rounded-xl text-gray-500 active">OK</button>
            <button onclick="setVal('sleep', 2, this)" class="segment-btn py-3.5 text-sm font-bold rounded-xl text-gray-500">Good</button>
          </div>
        </div>
        <div class="space-y-3">
          <label class="text-xs font-bold uppercase tracking-widest text-gray-400 ml-1">Food</label>
          <div class="grid grid-cols-3 gap-2 bg-gray-100 p-1.5 rounded-2xl">
            <button onclick="setVal('food', 0, this)" class="segment-btn py-3.5 text-sm font-bold rounded-xl text-gray-500">Light</button>
            <button onclick="setVal('food', 1, this)" class="segment-btn py-3.5 text-sm font-bold rounded-xl text-gray-500 active">Normal</button>
            <button onclick="setVal('food', 2, this)" class="segment-btn py-3.5 text-sm font-bold rounded-xl text-gray-500">Heavy</button>
          </div>
        </div>
        <div class="space-y-3">
          <label class="text-xs font-bold uppercase tracking-widest text-gray-400 ml-1">Movement</label>
          <div class="grid grid-cols-3 gap-2 bg-gray-100 p-1.5 rounded-2xl">
            <button onclick="setVal('move', 0, this)" class="segment-btn py-3.5 text-sm font-bold rounded-xl text-gray-500 active">None</button>
            <button onclick="setVal('move', 1, this)" class="segment-btn py-3.5 text-sm font-bold rounded-xl text-gray-500">Some</button>
            <button onclick="setVal('move', 2, this)" class="segment-btn py-3.5 text-sm font-bold rounded-xl text-gray-500">A lot</button>
          </div>
        </div>
      </div>
      <div class="pt-6 space-y-3">
        <button onclick="startLoadingSequence()" class="w-full py-5 rounded-2xl bg-black text-white font-black text-xl shadow-2xl shadow-gray-200 active:scale-[0.98] transition-transform">Check</button>
        <button onclick="randomize()" class="w-full py-4 text-gray-400 font-bold text-sm hover:text-black transition-colors">Randomize</button>
      </div>
    </div>

    <!-- SCREEN B: LOADING -->
    <div id="view-loading" class="hidden flex-grow flex flex-col items-center justify-center space-y-6">
      <div class="spinner"></div>
      <p id="loading-msg" class="text-gray-500 font-bold text-lg animate-pulse text-center px-4"></p>
    </div>

    <!-- SCREEN C: RESULT -->
    <div id="view-result" class="hidden flex-grow flex flex-col items-center space-y-8">
      <div class="text-center pt-4 opacity-0" id="score-anim-wrap">
        <div class="score-wrap">
          <span id="score-num" class="score-big text-[120px] font-black">--</span>
          <span class="score-outof">/100</span>
        </div>
        <p class="text-[10px] uppercase tracking-[0.2em] font-black text-gray-400 mt-2">Daily Score</p>
      </div>
      <div class="w-full p-8 rounded-[32px] bg-gray-50 border border-gray-100 text-center">
        <p id="verdict-text" class="text-2xl font-black text-black leading-tight"></p>
        <div id="result-chips" class="flex flex-wrap justify-center gap-2 mt-6"></div>
      </div>
      <div class="w-full space-y-3">
        <button onclick="downloadStory()" class="w-full py-5 rounded-2xl bg-black text-white font-black">Download Story Card</button>
        <button onclick="copyCaption()" id="copy-btn" class="w-full py-4 rounded-2xl bg-gray-100 text-black font-bold text-sm">Copy Viral Caption</button>
        <button onclick="resetApp()" class="w-full py-4 text-gray-400 text-xs font-bold underline">Reset / Start Over</button>
      </div>
    </div>

    <footer class="mt-auto py-8 text-center">
      <p class="text-[10px] text-gray-300 font-bold uppercase tracking-widest leading-relaxed px-8">Not medical advice. For entertainment and self-reflection only.</p>
    </footer>
  </main>

  <canvas id="storyCanvas" width="1080" height="1920" style="display:none;"></canvas>

  <script>
    let state = { sleep: 1, food: 1, move: 0 };
    const labels = {
      sleep: ['Bad', 'OK', 'Good'],
      food: ['Light', 'Normal', 'Heavy'],
      move: ['None', 'Some', 'A lot']
    };
    const loadingMsgs = ["Reading the vibes...", "Calculating today’s damage...", "Checking your main character status...", "Running the numbers...", "Assessing the chaos...", "Scanning for balance...", "Measuring the momentum...", "Auditing the basics...", "Doing the health math...", "Looking for signs of thriving...", "Evaluating energy levels...", "Compiling today’s stats...", "Cross-checking your choices...", "Finalizing your score...", "This might sting...", "Hang tight...", "Almost there...", "Preparing your verdict..."];
    const pools = {
      high: ["You’re in your era.", "This is a good day.", "Body and mind aligned.", "You did that.", "Low chaos. High control.", "Healthy, but make it chill.", "Everything’s clicking today.", "Main character energy.", "This is working.", "Quietly thriving."],
      mid: ["Functioning, not thriving.", "Middle of the road.", "Not bad. Not impressive.", "You showed up.", "Doing enough.", "A very average human day.", "Holding it together.", "Could be worse.", "Surprisingly fine.", "Stable, for now."],
      low: ["Running on fumes.", "Bare minimum mode.", "You’re running low today.", "Low energy, high effort.", "Surviving, not living.", "Chaos, but quietly.", "This day took a lot.", "You need a reset.", "Everything feels heavy.", "Not your best work."]
    };

    function setVal(cat, val, btn) {
      state[cat] = val;
      const parent = btn.parentElement;
      Array.from(parent.children).forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
    }

    function randomize() {
      ['sleep', 'food', 'move'].forEach(cat => {
        const r = Math.floor(Math.random() * 3);
        const btns = document.querySelectorAll(`button[onclick^="setVal('${cat}'"]`);
        setVal(cat, r, btns[r]);
      });
    }

    function startLoadingSequence() {
      document.getElementById('view-input').classList.add('hidden');
      document.getElementById('view-loading').classList.remove('hidden');
      document.getElementById('loading-msg').innerText = loadingMsgs[Math.floor(Math.random() * loadingMsgs.length)];

      const duration = (Math.floor(Math.random() * 6) + 3) * 1000;
      setTimeout(calculateAndShow, duration);
    }

    function calculateAndShow() {
      let score = 50;
      if (state.sleep === 0) score -= 15; else if (state.sleep === 2) score += 15;
      if (state.food === 0) score += 5; else if (state.food === 1) score += 10; else if (state.food === 2) score -= 5;
      if (state.move === 0) score -= 15; else if (state.move === 1) score += 5; else if (state.move === 2) score += 15;
      score = Math.max(0, Math.min(100, score));

      const verdict = getVerdict(score);
      const today = new Date().toISOString().split('T')[0];
      localStorage.setItem('hc_v4_data', JSON.stringify({ score, verdict, state, date: today }));

      renderResults(score, verdict);
    }

    function getVerdict(score) {
      if (state.sleep === 0 && state.move === 0) return Math.random() > 0.5 ? "Running on fumes." : "Carried entirely by caffeine.";
      if (state.food === 2 && state.move === 0) return "Heavy day. Light steps.";
      if (state.sleep === 2 && state.move === 2) return Math.random() > 0.5 ? "You’re in your era." : "Main character energy.";
      if (state.sleep === 2 && state.move === 0) return "Sleep did the heavy lifting.";
      if (state.sleep === 0 && state.move === 1) return "You pushed through.";
      if (state.sleep === 1 && state.food === 1 && state.move === 1) return "A day happened.";
      if (state.sleep === 1 && state.move === 1) return "Energy came and went.";
      if (score >= 75) return pools.high[Math.floor(Math.random() * pools.high.length)];
      if (score >= 45) return pools.mid[Math.floor(Math.random() * pools.mid.length)];
      return pools.low[Math.floor(Math.random() * pools.low.length)];
    }

    function renderResults(score, verdict) {
      document.getElementById('view-loading').classList.add('hidden');
      document.getElementById('view-input').classList.add('hidden');
      document.getElementById('view-result').classList.remove('hidden');
      document.getElementById('score-num').innerText = score;
      document.getElementById('verdict-text').innerText = verdict;

      const chipHtml = (k, v) => `<span class="px-3 py-1 bg-white border border-gray-200 rounded-full text-[10px] font-black uppercase tracking-wider text-gray-400">${k}: ${labels[k][v]}</span>`;
      document.getElementById('result-chips').innerHTML = chipHtml('sleep', state.sleep) + chipHtml('food', state.food) + chipHtml('move', state.move);

      const wrap = document.getElementById('score-anim-wrap');
      wrap.classList.add('animate-pop');

      triggerFX(score);
    }

    function triggerFX(score) {
      const canvas = document.getElementById('fx-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      let particles = [];
      const isGood = score >= 50;
      const count = isGood ? 120 : 150;

      for (let i = 0; i < count; i++) {
        if (isGood) {
          particles.push({
            x: Math.random() * canvas.width,
            y: canvas.height + 20,
            vx: Math.random() * 2 - 1,
            vy: -(Math.random() * 8 + 4),
            w: Math.random() * 12 + 6,
            h: Math.random() * 12 + 6,
            color: `hsl(${Math.random() * 360}, 80%, 60%)`,
            rotation: Math.random() * 360,
            rotationSpeed: Math.random() * 10 - 5
          });
        } else {
          // Flames rising from bottom
          particles.push({
            x: Math.random() * canvas.width,
            y: canvas.height + Math.random() * 100,
            vx: (Math.random() - 0.5) * 1.5,
            vy: -(Math.random() * 3 + 2),
            radius: Math.random() * 20 + 10,
            life: 1,
            decay: Math.random() * 0.02 + 0.015,
            color: `rgba(255, ${Math.floor(Math.random() * 100 + 50)}, 0, `
          });
        }
      }

      const startTime = Date.now();
      function animate() {
        const elapsed = Date.now() - startTime;
        if (elapsed > 2500) { ctx.clearRect(0, 0, canvas.width, canvas.height); return; }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach((p) => {
          if (isGood) {
            p.x += p.vx;
            p.y += p.vy;
            p.rotation += p.rotationSpeed;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rotation * Math.PI / 180);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
            ctx.restore();
          } else {
            p.x += p.vx;
            p.y += p.vy;
            p.life -= p.decay;
            p.radius *= 0.98;

            if (p.life > 0) {
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
              ctx.fillStyle = p.color + p.life + ')';
              ctx.fill();
            } else {
              if (elapsed < 2000) {
                p.x = Math.random() * canvas.width;
                p.y = canvas.height + 20;
                p.life = 1;
                p.radius = Math.random() * 20 + 10;
              }
            }
          }
        });
        requestAnimationFrame(animate);
      }
      animate();
    }

    // SAFER copyCaption: clipboard API with fallback
    function copyCaption() {
      const score = document.getElementById('score-num').innerText;
      const caps = [
        `Be honest... what’s your HealthCheck score? Mine is ${score}.`,
        `This app read me today. Score: ${score}/100.`,
        `Didn’t expect this score. ${score}/100`,
        `My vibes today: ${score}% healthy.`,
        `Judgment day arrived. Result: ${score}/100`,
        `Daily check-in completed. ${score} points.`
      ];
      const text = caps[Math.floor(Math.random() * caps.length)];

      const b = document.getElementById('copy-btn');
      const old = b.innerText;

      // Prefer modern clipboard if available
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => {
          b.innerText = "Copied!";
          setTimeout(() => b.innerText = old, 1500);
        }).catch(() => legacyCopy(text));
      } else {
        legacyCopy(text);
      }

      function legacyCopy(t) {
        const ta = document.createElement("textarea");
        ta.value = t;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        b.innerText = "Copied!";
        setTimeout(() => b.innerText = old, 1500);
      }
    }

    // SAFARI-FRIENDLY DOWNLOAD: toBlob + objectURL + click in DOM
    async function downloadStory() {
      const canvas = document.getElementById('storyCanvas');
      const ctx = canvas.getContext('2d');

      const score = document.getElementById('score-num').innerText;
      const verdict = document.getElementById('verdict-text').innerText;

      // Draw the card synchronously (no setTimeout)
      ctx.clearRect(0, 0, 1080, 1920);
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, 1080, 1920);

      ctx.fillStyle = '#000000';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      ctx.font = '900 110px Inter';
      ctx.fillText('HealthCheck', 540, 280);

      ctx.fillStyle = '#9ca3af';
      ctx.font = '700 44px Inter';
      ctx.fillText(
        new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }).toUpperCase(),
        540,
        360
      );

      ctx.fillStyle = '#000000';
      ctx.font = '900 560px Inter';
      ctx.textBaseline = 'middle';
      ctx.fillText(score, 540, 850);

      ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = '#9ca3af';
      ctx.font = '700 90px Inter';
      ctx.fillText('/100', 540, 1180);

      ctx.fillStyle = '#f9fafb';
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(100, 1280, 880, 420, 80);
      else {
        // Fallback if roundRect unsupported
        roundRectFallback(ctx, 100, 1280, 880, 420, 80);
      }
      ctx.fill();

      ctx.fillStyle = '#000000';
      ctx.font = '900 76px Inter';
      ctx.textBaseline = 'top';
      wrapText(ctx, verdict, 540, 1440, 800, 100);

      ctx.fillStyle = '#e5e7eb';
      ctx.font = '900 40px Inter';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText('HEALTHCHECK.APP', 540, 1820);

      // Use toBlob for Safari reliability
      canvas.toBlob((blob) => {
        if (!blob) {
          // last-resort fallback
          const link = document.createElement('a');
          link.download = `healthcheck-${score}.png`;
          link.href = canvas.toDataURL('image/png');
          document.body.appendChild(link);
          link.click();
          link.remove();
          return;
        }

        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.download = `healthcheck-${score}.png`;
        link.href = url;

        document.body.appendChild(link);
        link.click();
        link.remove();

        URL.revokeObjectURL(url);
      }, 'image/png');
    }

    function roundRectFallback(ctx, x, y, w, h, r) {
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';
      for (let n = 0; n < words.length; n++) {
        let testLine = line + words[n] + ' ';
        if (ctx.measureText(testLine).width > maxWidth && n > 0) {
          ctx.fillText(line.trim(), x, y);
          line = words[n] + ' ';
          y += lineHeight;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line.trim(), x, y);
    }

    function resetApp() {
      localStorage.removeItem('hc_v4_data');
      location.reload();
    }

    window.onload = () => {
      const saved = localStorage.getItem('hc_v4_data');
      if (saved) {
        const d = JSON.parse(saved);
        if (d.date === new Date().toISOString().split('T')[0]) {
          state = d.state;
          renderResults(d.score, d.verdict);
        }
      }
    };
  </script>
</body>
</html>
